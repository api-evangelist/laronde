    Flagship Pioneering merged Laronde and Senda Biosciences in October 2023) is a preclinical
    biopharmaceutical company whose product is an in vivo CAR-T drug pipeline, not software —
    www.sail.bio is a 14-page WordPress marketing site on WP Engine that returns an honest 404 for
    every OpenAPI, GraphQL, llms.txt and /.well-known/ path, api./docs./developer./data./mcp. and
    every other developer subdomain are NXDOMAIN, and no package exists on npm, PyPI, RubyGems or
    crates.io; the site's only machine-readable surface is the stock WordPress core REST API at
    /wp-json/, which is the CMS, not a published API.
