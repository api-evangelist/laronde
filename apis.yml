aid: laronde
name: Sail Biomedicines
description: >-
  Sail Biomedicines is a Cambridge, Massachusetts preclinical biotechnology company created in
  October 2023 by Flagship Pioneering through the merger of Laronde and Senda Biosciences, and it
  is the company this profile's legacy `laronde` slug refers to. Sail combines Laronde's Endless
  RNA (eRNA) platform — synthetic circular RNA engineered to be translated persistently inside the
  body — with Senda's programmable lipid and natural nanoparticle delivery chemistry, and layers
  generative AI on the combined dataset to design what the company calls fully programmable
  medicines. Its lead effort is in vivo CAR-T for autoimmune disease: instructing a patient's own
  T cells to reprogram themselves inside the body rather than extracting, engineering and
  reinfusing them, an approach Sail markets as "immune reset". In July 2026 Johnson & Johnson
  committed $785 million up front (including a $465 million equity investment) plus up to $140
  million in milestones and took an exclusive option to acquire the company for a further $2.58
  billion. Sail sells therapeutics, not software: it publishes no API, no SDK, no machine-readable
  specification and no developer documentation, and it operates no public source-code organization.
