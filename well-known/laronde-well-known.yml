note: >-
  No /.well-known document is served by any Sail Biomedicines host, so NO WellKnown and NO
  SecurityTxt pointer is wired — this file records an absence, not a presence. www.sail.bio is a
  WordPress site on WP Engine and answers honestly: /.well-known/security.txt returns a 548-byte
  nginx 404 from the edge, and every other /.well-known/* path returns the site's own 48,242-byte
  WordPress 404 template. A randomly-named control path under /.well-known/ returned the identical
  404, confirming the host is not a soft-200 catch-all. The apex sail.bio 301s to www for every
  path except security.txt, which it 404s directly. The only machine-readable surface on the domain
  is the stock WordPress core REST API at https://www.sail.bio/wp-json/ (HTTP 200, 252 routes
  across 15 namespaces, all of them WordPress core, Yoast SEO, FileBird, WP Engine and
  Pattern Manager plugin routes). That is the CMS behind a marketing site, not an API this company
  publishes as a product, so it is recorded here as an observation and is NOT wired as a contract.
